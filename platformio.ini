[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB

; N16R8 module: quad flash + octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; Two OTA app slots (6.5 MB each) + 3.4 MB LittleFS partition
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -I lib/stb
  ; The define only switches the embed step on; the file list below is what is used.
  -D COMPONENT_EMBED_FILES=fonts

; TrueType fonts built into the firmware (see tools/make_fonts.py)
board_build.embed_files =
  fonts/sans.ttf
  fonts/bold.ttf
  fonts/emoji.ttf

lib_deps =
  lovyan03/LovyanGFX
  adafruit/Adafruit NeoPixel
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
  bblanchon/ArduinoJson@^7
  bitbank2/AnimatedGIF
