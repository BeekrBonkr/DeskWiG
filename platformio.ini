; Two boards, one firmware. `pio run` builds the DevKitC; add
; `-e seeed_xiao_esp32s3` for the XIAO. Pins live in src/app/Board.h.
[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -I lib/stb
  ; The define only switches the embed step on; the file list below is what is used.
  -D COMPONENT_EMBED_FILES=fonts

; Files built into the firmware: TrueType fonts (tools/make_fonts.py) and the
; CodeMirror bundle for the widget editor (tools/editor, pre-gzipped)
board_build.embed_files =
  fonts/sans.ttf
  fonts/bold.ttf
  fonts/emoji.ttf
  web/cm.js.gz

lib_deps =
  lovyan03/LovyanGFX
  adafruit/Adafruit NeoPixel
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
  bblanchon/ArduinoJson@^7
  bitbank2/AnimatedGIF

; ESP32-S3-DevKitC-1, N16R8 module: 16 MB quad flash + 8 MB octal PSRAM
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
; Two OTA app slots (6.5 MB each) + 3.4 MB LittleFS partition
board_build.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  -D DESKWIG_BOARD_DEVKITC

; Seeed XIAO ESP32S3: 8 MB quad flash + 8 MB octal PSRAM
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
; Two OTA app slots (3.3 MB each) + 1.5 MB LittleFS partition
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -D DESKWIG_BOARD_XIAO
